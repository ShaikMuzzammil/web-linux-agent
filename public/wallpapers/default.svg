<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Grid lines -->
  <g stroke="rgba(124,77,255,0.06)" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <!-- Stars -->
  <g fill="white" opacity="0.4">
    <circle cx="120" cy="80" r="1.5"/><circle cx="340" cy="200" r="1"/><circle cx="680" cy="150" r="1.5"/>
    <circle cx="900" cy="60" r="1"/><circle cx="1200" cy="180" r="1.5"/><circle cx="1600" cy="90" r="1"/>
    <circle cx="1800" cy="300" r="1.5"/><circle cx="200" cy="500" r="1"/><circle cx="500" cy="700" r="1.5"/>
    <circle cx="800" cy="900" r="1"/><circle cx="1100" cy="800" r="1.5"/><circle cx="1500" cy="600" r="1"/>
    <circle cx="1750" cy="750" r="1.5"/><circle cx="400" cy="350" r="1"/>
  </g>
  <!-- Center glow orb -->
  <circle cx="960" cy="540" r="200" fill="none" stroke="rgba(124,77,255,0.08)" stroke-width="1"/>
  <circle cx="960" cy="540" r="350" fill="none" stroke="rgba(124,77,255,0.04)" stroke-width="1"/>
  <circle cx="960" cy="540" r="500" fill="none" stroke="rgba(124,77,255,0.02)" stroke-width="1"/>
</svg>
