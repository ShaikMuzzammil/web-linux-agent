<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020d18"/>
      <stop offset="50%" stop-color="#041520"/>
      <stop offset="100%" stop-color="#021018"/>
    </linearGradient>
    <filter id="wave"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="waveblur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#ocean)"/>
  <ellipse cx="960" cy="400" rx="1000" ry="300" fill="rgba(0,150,180,0.10)" filter="url(#waveblur)"/>
  <ellipse cx="500" cy="700" rx="600" ry="200" fill="rgba(0,180,200,0.08)" filter="url(#waveblur)"/>
  <ellipse cx="1400" cy="600" rx="500" ry="180" fill="rgba(0,100,160,0.10)" filter="url(#waveblur)"/>
  <!-- Wave lines -->
  <path d="M0,600 Q240,560 480,600 Q720,640 960,600 Q1200,560 1440,600 Q1680,640 1920,600" stroke="rgba(0,200,255,0.08)" strokeWidth="2" fill="none"/>
  <path d="M0,650 Q240,610 480,650 Q720,690 960,650 Q1200,610 1440,650 Q1680,690 1920,650" stroke="rgba(0,180,220,0.06)" strokeWidth="1.5" fill="none"/>
  <path d="M0,700 Q240,660 480,700 Q720,740 960,700 Q1200,660 1440,700 Q1680,740 1920,700" stroke="rgba(0,160,200,0.05)" strokeWidth="1" fill="none"/>
  <!-- Stars reflection -->
  <circle cx="400" cy="200" r="1" fill="white" opacity="0.5"/>
  <circle cx="800" cy="150" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="1200" cy="180" r="1" fill="white" opacity="0.6"/>
  <circle cx="1600" cy="120" r="1.2" fill="white" opacity="0.5"/>
</svg>
