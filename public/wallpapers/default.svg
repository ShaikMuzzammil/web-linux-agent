  </g>
  <!-- Brighter stars -->
  <g fill="white">
    <circle cx="400" cy="100" r="1.5" opacity="0.9"/><circle cx="900" cy="150" r="1.3" opacity="0.85"/>
    <circle cx="1400" cy="80" r="1.6" opacity="0.9"/><circle cx="600" cy="320" r="1.4" opacity="0.8"/>
