<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0008"/>
      <stop offset="60%" stop-color="#1a0520"/>
      <stop offset="100%" stop-color="#2a0510"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bigblur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky2)"/>
  <!-- Orange horizon glow -->
  <ellipse cx="960" cy="720" rx="1200" ry="200" fill="rgba(233,84,32,0.15)" filter="url(#bigblur)"/>
  <ellipse cx="960" cy="750" rx="800" ry="100" fill="rgba(255,100,0,0.20)" filter="url(#bigblur)"/>
  <!-- Buildings silhouette -->
  <rect x="0" y="600" width="80" height="480" fill="#0d0010"/>
  <rect x="100" y="500" width="60" height="580" fill="#0d0010"/>
  <rect x="180" y="450" width="100" height="630" fill="#0d0010"/>
  <rect x="300" y="400" width="80" height="680" fill="#0d0010"/>
  <rect x="400" y="550" width="50" height="530" fill="#0d0010"/>
  <rect x="460" y="480" width="120" height="600" fill="#0d0010"/>
  <rect x="600" y="350" width="90" height="730" fill="#0d0010"/>
  <rect x="700" y="500" width="70" height="580" fill="#0d0010"/>
  <rect x="800" y="420" width="110" height="660" fill="#0d0010"/>
  <rect x="930" y="380" width="100" height="700" fill="#0d0010"/>
  <rect x="1050" y="450" width="80" height="630" fill="#0d0010"/>
  <rect x="1150" y="400" width="130" height="680" fill="#0d0010"/>
  <rect x="1300" y="480" width="90" height="600" fill="#0d0010"/>
  <rect x="1400" y="360" width="70" height="720" fill="#0d0010"/>
  <rect x="1490" y="440" width="110" height="640" fill="#0d0010"/>
  <rect x="1620" y="500" width="80" height="580" fill="#0d0010"/>
  <rect x="1720" y="420" width="100" height="660" fill="#0d0010"/>
  <rect x="1840" y="380" width="80" height="700" fill="#0d0010"/>
  <!-- Neon window lights -->
  <rect x="110" y="520" width="4" height="4" fill="#E95420" opacity="0.8"/>
  <rect x="650" y="400" width="4" height="4" fill="#E95420" opacity="0.6"/>
  <rect x="820" y="450" width="4" height="4" fill="#ff6600" opacity="0.7"/>
  <rect x="1000" y="420" width="4" height="4" fill="#E95420" opacity="0.9"/>
  <rect x="1160" y="430" width="4" height="4" fill="#ff4400" opacity="0.6"/>
  <rect x="1420" y="390" width="4" height="4" fill="#E95420" opacity="0.8"/>
  <!-- Ground / road -->
  <rect x="0" y="720" width="1920" height="360" fill="#0a0005"/>
  <line x1="0" y1="760" x2="1920" y2="760" stroke="rgba(233,84,32,0.3)" strokeWidth="1"/>
</svg>
