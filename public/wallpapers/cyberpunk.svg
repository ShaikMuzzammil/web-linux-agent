<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050008"/>
      <stop offset="40%" stop-color="#120018"/>
      <stop offset="75%" stop-color="#1a0520"/>
      <stop offset="100%" stop-color="#0a0005"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="bigblur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Moon -->
  <circle cx="1700" cy="120" r="55" fill="#ffe8cc" opacity="0.9"/>
  <circle cx="1720" cy="110" r="55" fill="#120018"/>
  <circle cx="1700" cy="120" r="70" fill="#ff660022" filter="url(#glow)"/>
  <!-- Big atmosphere glow -->
  <ellipse cx="960" cy="700" rx="1400" ry="280" fill="#E9542015" filter="url(#bigblur)"/>
  <ellipse cx="960" cy="680" rx="800" ry="140" fill="#ff440025" filter="url(#glow)"/>
  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="100" cy="50" r="0.7"/><circle cx="250" cy="30" r="0.9"/><circle cx="420" cy="70" r="0.6"/>
    <circle cx="600" cy="25" r="0.8"/><circle cx="780" cy="55" r="0.7"/><circle cx="950" cy="35" r="1"/>
    <circle cx="1130" cy="65" r="0.6"/><circle cx="1310" cy="20" r="0.8"/><circle cx="1480" cy="50" r="0.7"/>
    <circle cx="1600" cy="40" r="0.9"/><circle cx="1820" cy="70" r="0.6"/>
    <circle cx="180" cy="160" r="0.8"/><circle cx="370" cy="190" r="0.6"/><circle cx="560" cy="150" r="0.9"/>
    <circle cx="740" cy="175" r="0.7"/><circle cx="920" cy="145" r="0.8"/><circle cx="1100" cy="185" r="0.6"/>
    <circle cx="1280" cy="155" r="0.9"/><circle cx="1460" cy="175" r="0.7"/><circle cx="1640" cy="150" r="0.8"/>
    <circle cx="1850" cy="165" r="0.6"/>
  </g>
  <!-- Building silhouettes — far layer -->
  <rect x="0"    y="520" width="60"  height="560" fill="#06000a"/>
  <rect x="70"   y="450" width="50"  height="630" fill="#06000a"/>
  <rect x="130"  y="400" width="80"  height="680" fill="#06000a"/>
  <rect x="220"  y="480" width="55"  height="600" fill="#06000a"/>
  <rect x="285"  y="360" width="70"  height="720" fill="#06000a"/>
  <rect x="365"  y="430" width="90"  height="650" fill="#06000a"/>
  <rect x="465"  y="320" width="65"  height="760" fill="#06000a"/>
  <rect x="540"  y="470" width="75"  height="610" fill="#06000a"/>
  <rect x="625"  y="380" width="55"  height="700" fill="#06000a"/>
  <rect x="690"  y="350" width="95"  height="730" fill="#06000a"/>
  <rect x="795"  y="420" width="60"  height="660" fill="#06000a"/>
  <rect x="865"  y="300" width="80"  height="780" fill="#06000a"/>
  <rect x="955"  y="460" width="70"  height="620" fill="#06000a"/>
  <rect x="1035" y="390" width="55"  height="690" fill="#06000a"/>
  <rect x="1100" y="340" width="90"  height="740" fill="#06000a"/>
  <rect x="1200" y="480" width="65"  height="600" fill="#06000a"/>
  <rect x="1275" y="370" width="75"  height="710" fill="#06000a"/>
  <rect x="1360" y="430" width="55"  height="650" fill="#06000a"/>
  <rect x="1425" y="310" width="100" height="770" fill="#06000a"/>
  <rect x="1535" y="455" width="70"  height="625" fill="#06000a"/>
  <rect x="1615" y="395" width="80"  height="685" fill="#06000a"/>
  <rect x="1705" y="350" width="60"  height="730" fill="#06000a"/>
  <rect x="1775" y="415" width="85"  height="665" fill="#06000a"/>
  <rect x="1870" y="370" width="50"  height="710" fill="#06000a"/>
  <!-- Neon window lights — orange -->
  <g fill="#E95420" opacity="0.7" filter="url(#neon)">
    <rect x="75"   y="470" width="5" height="5"/><rect x="140"  y="420" width="5" height="5"/>
    <rect x="235"  y="500" width="4" height="4"/><rect x="300"  y="380" width="5" height="5"/>
    <rect x="480"  y="340" width="5" height="5"/><rect x="556"  y="490" width="4" height="4"/>
    <rect x="650"  y="400" width="5" height="5"/><rect x="715"  y="370" width="5" height="5"/>
    <rect x="880"  y="320" width="5" height="5"/><rect x="975"  y="480" width="4" height="4"/>
    <rect x="1050" y="410" width="5" height="5"/><rect x="1120" y="360" width="5" height="5"/>
    <rect x="1215" y="500" width="4" height="4"/><rect x="1295" y="390" width="5" height="5"/>
    <rect x="1445" y="330" width="5" height="5"/><rect x="1555" y="475" width="4" height="4"/>
    <rect x="1635" y="415" width="5" height="5"/><rect x="1720" y="370" width="5" height="5"/>
    <rect x="1800" y="435" width="4" height="4"/><rect x="1890" y="390" width="5" height="5"/>
  </g>
  <!-- Neon lights — blue/cyan -->
  <g fill="#00ccff" opacity="0.4" filter="url(#neon)">
    <rect x="100"  y="500" width="4" height="4"/><rect x="310"  y="410" width="4" height="4"/>
    <rect x="640"  y="440" width="4" height="4"/><rect x="870"  y="350" width="4" height="4"/>
    <rect x="1070" y="440" width="4" height="4"/><rect x="1300" y="420" width="4" height="4"/>
    <rect x="1570" y="440" width="4" height="4"/><rect x="1790" y="395" width="4" height="4"/>
  </g>
  <!-- Neon horizon line -->
  <rect x="0" y="700" width="1920" height="2" fill="#E95420" opacity="0.5" filter="url(#neon)"/>
  <!-- Ground & reflection -->
  <rect x="0" y="702" width="1920" height="378" fill="#04000708"/>
  <rect x="0" y="702" width="1920" height="378" fill="url(#sky)" opacity="0.7"/>
  <!-- Neon road lines -->
  <line x1="600" y1="702" x2="300" y2="1080" stroke="#E9542040" stroke-width="2" filter="url(#neon)"/>
  <line x1="1320" y1="702" x2="1620" y2="1080" stroke="#E9542040" stroke-width="2" filter="url(#neon)"/>
  <line x1="960" y1="702" x2="960" y2="1080" stroke="#E9542030" stroke-width="3" filter="url(#neon)"/>
</svg>
