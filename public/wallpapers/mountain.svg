<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02050f"/>
      <stop offset="35%" stop-color="#071525"/>
      <stop offset="70%" stop-color="#1a2845"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="100%" stop-color="#f0d890"/>
    </radialGradient>
    <filter id="blur60"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Moon glow -->
  <circle cx="1500" cy="180" r="120" fill="#ffffff10" filter="url(#blur60)"/>
  <circle cx="1500" cy="180" r="55" fill="url(#moon)"/>
  <circle cx="1480" cy="165" r="8" fill="#e8d07040" />
  <circle cx="1515" cy="195" r="5" fill="#e8d07030"/>
  <!-- Milky way streak -->
  <path d="M200 0 Q600 300 1000 200 Q1400 100 1920 400" stroke="rgba(200,200,255,0.08)" stroke-width="120" fill="none" filter="url(#blur60)"/>
  <!-- Stars -->
  <g fill="white">
    <circle cx="50"   cy="30"  r="0.8" opacity="0.9"/><circle cx="140"  cy="55"  r="0.6" opacity="0.8"/>
    <circle cx="230"  cy="20"  r="1"   opacity="0.9"/><circle cx="350"  cy="65"  r="0.7" opacity="0.85"/>
    <circle cx="470"  cy="35"  r="0.8" opacity="0.8"/><circle cx="600"  cy="50"  r="0.6" opacity="0.9"/>
    <circle cx="720"  cy="25"  r="1"   opacity="0.85"/><circle cx="840"  cy="60"  r="0.7" opacity="0.8"/>
    <circle cx="980"  cy="40"  r="0.9" opacity="0.9"/><circle cx="1100" cy="70"  r="0.6" opacity="0.85"/>
    <circle cx="1220" cy="30"  r="0.8" opacity="0.8"/><circle cx="1350" cy="55"  r="1"   opacity="0.9"/>
    <circle cx="1620" cy="45"  r="0.7" opacity="0.85"/><circle cx="1730" cy="70"  r="0.8" opacity="0.8"/>
    <circle cx="1860" cy="35"  r="0.9" opacity="0.9"/>
    <circle cx="100"  cy="150" r="0.7" opacity="0.7"/><circle cx="280"  cy="175" r="0.9" opacity="0.75"/>
    <circle cx="430"  cy="140" r="0.6" opacity="0.8"/><circle cx="570"  cy="165" r="0.8" opacity="0.7"/>
    <circle cx="720"  cy="150" r="0.7" opacity="0.75"/><circle cx="880"  cy="180" r="0.9" opacity="0.7"/>
    <circle cx="1020" cy="145" r="0.6" opacity="0.8"/><circle cx="1160" cy="175" r="0.8" opacity="0.75"/>
    <circle cx="1290" cy="155" r="0.7" opacity="0.7"/><circle cx="1420" cy="140" r="0.9" opacity="0.75"/>
    <circle cx="1660" cy="160" r="0.6" opacity="0.8"/><circle cx="1790" cy="175" r="0.8" opacity="0.7"/>
    <circle cx="160"  cy="280" r="0.8" opacity="0.65"/><circle cx="340"  cy="310" r="0.6" opacity="0.7"/>
    <circle cx="500"  cy="270" r="0.9" opacity="0.65"/><circle cx="680"  cy="300" r="0.7" opacity="0.7"/>
    <circle cx="840"  cy="280" r="0.8" opacity="0.65"/><circle cx="1040" cy="315" r="0.6" opacity="0.7"/>
    <circle cx="1200" cy="285" r="0.9" opacity="0.65"/><circle cx="1380" cy="305" r="0.7" opacity="0.7"/>
    <circle cx="1540" cy="270" r="0.8" opacity="0.65"/><circle cx="1710" cy="295" r="0.6" opacity="0.7"/>
    <circle cx="1890" cy="280" r="0.9" opacity="0.65"/>
    <!-- Bright stars -->
    <circle cx="380"  cy="100" r="1.4" opacity="1"/><circle cx="870"  cy="80"  r="1.6" opacity="0.95"/>
    <circle cx="1300" cy="120" r="1.5" opacity="1"/><circle cx="700"  cy="200" r="1.3" opacity="0.9"/>
    <circle cx="1750" cy="100" r="1.4" opacity="0.95"/>
  </g>
  <!-- Far mountains — lightest -->
  <path d="M0 700 L160 560 L320 640 L480 520 L640 600 L800 480 L920 560 L1040 490 L1200 580 L1360 500 L1520 590 L1680 510 L1840 600 L1920 550 L1920 1080 L0 1080Z" fill="#0a1528"/>
  <!-- Mid mountains -->
  <path d="M0 760 L200 620 L380 710 L520 590 L700 680 L880 560 L1020 650 L1160 580 L1360 670 L1540 580 L1720 680 L1920 600 L1920 1080 L0 1080Z" fill="#061020"/>
  <!-- Near mountains -->
  <path d="M0 850 L280 700 L440 790 L600 680 L760 780 L960 650 L1120 760 L1300 660 L1480 770 L1680 680 L1860 780 L1920 740 L1920 1080 L0 1080Z" fill="#040c18"/>
  <!-- Snow caps -->
  <path d="M440 790 L520 680 Q560 640 600 680 Z" fill="rgba(220,230,255,0.5)"/>
  <path d="M760 780 L840 665 Q880 630 920 665 L960 650 Z" fill="rgba(220,230,255,0.45)"/>
  <path d="M1120 760 L1200 655 Q1240 620 1280 655 L1300 660 Z" fill="rgba(220,230,255,0.5)"/>
  <!-- Foreground trees -->
  <g fill="#020a10">
    <path d="M0 1080 L0 920 L20 860 L40 920 L40 1080Z"/>
    <path d="M60 1080 L60 900 L80 840 L100 900 L100 1080Z"/>
    <path d="M1800 1080 L1800 910 L1820 850 L1840 910 L1840 1080Z"/>
    <path d="M1860 1080 L1860 930 L1880 870 L1900 930 L1900 1080Z"/>
  </g>
  <!-- Moon reflection on snow -->
  <ellipse cx="960" cy="1040" rx="400" ry="30" fill="#ffffff08" filter="url(#blur10)"/>
</svg>
