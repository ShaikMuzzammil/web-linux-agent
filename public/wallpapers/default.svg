<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Ubuntu dark gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A0B06"/>
      <stop offset="40%"  stop-color="#1C0D08"/>
      <stop offset="100%" stop-color="#0D0808"/>
    </linearGradient>
    <!-- Orange glow bottom-left -->
    <radialGradient id="g1" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#E95420" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm glow top-right -->
    <radialGradient id="g2" cx="82%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#AE4E1E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#AE4E1E" stop-opacity="0"/>
    </radialGradient>
    <!-- Centre deep glow -->
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E95420" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
    <circle cx="32" cy="32" r="1" fill="#E95420" fill-opacity="0.04"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- Large Ubuntu circle-of-friends watermark (centre, very transparent) -->
  <g transform="translate(760,290) scale(4)" opacity="0.04">
    <circle cx="50" cy="9"  r="9"  fill="#E95420"/>
    <circle cx="14" cy="71" r="9"  fill="#E95420"/>
    <circle cx="86" cy="71" r="9"  fill="#E95420"/>
    <path d="M50 18 A32 32 0 0 1 77.7 64" stroke="#E95420" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M77.7 64 A32 32 0 0 1 22.3 64" stroke="#E95420" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M22.3 64 A32 32 0 0 1 50 18" stroke="#E95420" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="9"  r="4" fill="white"/>
    <circle cx="14" cy="71" r="4" fill="white"/>
    <circle cx="86" cy="71" r="4" fill="white"/>
  </g>

  <!-- Horizontal line near top -->
  <line x1="0" y1="3" x2="1920" y2="3" stroke="#E95420" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- Thin accent line bottom -->
  <line x1="0" y1="1077" x2="1920" y2="1077" stroke="#E95420" stroke-opacity="0.1" stroke-width="1"/>
</svg>
