<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#080020"/>
      <stop offset="100%" stop-color="#000008"/>
    </radialGradient>
    <radialGradient id="n1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2288" stop-opacity="0.22"/>
