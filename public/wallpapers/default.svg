<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="30%" cy="70%" r="90%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="60%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <radialGradient id="glo1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E95420" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glo3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2196F3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2196F3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur60"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur90"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
