    <circle cx="80" cy="380" r="0.6"/><circle cx="300" cy="420" r="0.9"/><circle cx="500" cy="360" r="0.7"/>
    <circle cx="750" cy="430" r="0.8"/><circle cx="950" cy="380" r="0.6"/><circle cx="1150" cy="440" r="1"/>
    <circle cx="1400" cy="390" r="0.7"/><circle cx="1650" cy="420" r="0.8"/><circle cx="1850" cy="360" r="0.6"/>
    <circle cx="160" cy="560" r="0.8"/><circle cx="380" cy="600" r="0.6"/><circle cx="580" cy="540" r="1"/>
    <circle cx="780" cy="580" r="0.7"/><circle cx="1020" cy="550" r="0.8"/><circle cx="1280" cy="590" r="0.6"/>
    <circle cx="1480" cy="560" r="1"/><circle cx="1700" cy="580" r="0.7"/><circle cx="1900" cy="540" r="0.6"/>
    <circle cx="60" cy="730" r="0.7"/><circle cx="250" cy="770" r="0.9"/><circle cx="460" cy="720" r="0.6"/>
